<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<title>Goings On About Town — For Juli</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f1ebd9;
    --paper-2: #ede6d0;
    --ink: #1a1814;
    --ink-2: #3a352c;
    --ink-3: #7a7363;
    --rule: #c8bfa4;
    --rule-2: #a89e80;
    --red: #b3001b;
    --red-soft: #f0d8d8;
    --serif: "Adobe Caslon Pro","ITC Caslon 224","Big Caslon","Hoefler Text","Garamond","Times New Roman",Times,serif;
    --sans: "Neue Haas Grotesk Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .page { max-width: 740px; margin: 0 auto; padding: 48px 40px 80px; }

  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--red); }
  button { font-family: inherit; cursor: pointer; }

  /* ── AUTH GATE ── */
  .auth-gate { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
  .auth-gate.show { display: flex; }
  .auth-card { max-width: 380px; width: 100%; text-align: center; }
  .auth-card .kicker { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--ink-2); letter-spacing: 0.18em; text-transform: uppercase; margin: 0 0 14px; }
  .auth-card .title { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: 38px; line-height: 1.05; letter-spacing: -0.005em; margin: 0 0 24px; padding-bottom: 22px; border-bottom: 2px solid var(--ink); position: relative; }
  .auth-card .title::after { content: ""; display: block; height: 1px; background: var(--ink); position: absolute; left: 0; right: 0; bottom: -3px; }
  .auth-intro { font-family: var(--serif); font-style: italic; color: var(--ink-2); font-size: 14.5px; margin: 28px 0 22px; line-height: 1.6; }
  .auth-form { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .auth-form input { background: transparent; border: none; border-bottom: 1px solid var(--rule-2); padding: 10px 0; font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--ink); text-align: center; }
  .auth-form input:focus { outline: none; border-bottom-color: var(--ink); }
  #auth-code { letter-spacing: 0.5em; font-variant-numeric: tabular-nums; font-style: normal; font-size: 22px; padding: 14px 0; }
  .auth-form button { background: var(--ink); color: var(--paper); border: none; padding: 11px 18px; font-family: var(--serif); font-variant: small-caps; font-size: 13px; letter-spacing: 0.14em; cursor: pointer; transition: background 0.2s; }
  .auth-form button:hover:not(:disabled) { background: var(--red); }
  .auth-form button:disabled { opacity: 0.5; cursor: default; }
  .auth-step { display: none; }
  .auth-step.show { display: flex; flex-direction: column; gap: 14px; }
  .auth-back { background: none; border: none; font: inherit; font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--ink-3); text-decoration: underline; text-decoration-style: dotted; cursor: pointer; margin-top: 4px; padding: 0; align-self: center; }
  .auth-back:hover { color: var(--red); }
  .auth-status { font-family: var(--serif); font-style: italic; font-size: 13.5px; color: var(--ink-3); margin-top: 18px; min-height: 1.2em; line-height: 1.5; }
  .auth-status.success { color: var(--red); }
  .auth-status.error { color: var(--red); }

  /* ── APP ── */
  .app { display: none; }
  .app.show { display: block; }

  /* MASTHEAD */
  .masthead { text-align: center; padding-bottom: 22px; border-bottom: 2px solid var(--ink); position: relative; }
  .masthead::after { content: ""; display: block; height: 1px; background: var(--ink); margin-top: 3px; }
  .kicker { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--ink-2); letter-spacing: 0.18em; text-transform: uppercase; margin: 0 0 14px; }
  .title { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: 48px; line-height: 1; letter-spacing: -0.005em; margin: 0; }
  .dateline { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--ink-2); letter-spacing: 0.08em; margin-top: 12px; }
  .dateline strong { font-weight: 500; color: var(--ink); font-variant: small-caps; letter-spacing: 0.14em; }

  /* INTRO LINE */
  .intro { text-align: center; font-style: italic; font-size: 14px; color: var(--ink-3); margin: 20px 0 36px; }
  .intro .dot { display: inline-block; margin: 0 8px; color: var(--rule-2); }

  /* SECTION BANNER */
  .banner { display: flex; align-items: center; gap: 14px; margin: 44px 0 18px; }
  .banner .rule { flex: 1; height: 1px; background: var(--ink); }
  .banner .label { font-family: var(--serif); font-variant: small-caps; font-weight: 500; font-size: 17px; letter-spacing: 0.22em; color: var(--red); }
  .banner .count { font-family: var(--serif); font-style: italic; font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }

  /* WEEKEND PANEL */
  .weekend-intro { font-family: var(--serif); font-style: italic; color: var(--ink-2); font-size: 15px; line-height: 1.6; margin: 0 0 18px; }
  .weekend-intro::first-letter { font-family: var(--serif); font-style: italic; float: left; font-size: 52px; line-height: 0.85; padding: 4px 8px 0 0; color: var(--red); }
  .weekend-list { border-top: 1px solid var(--rule); }
  .weekend-item { padding: 14px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 86px 1fr; gap: 18px; }
  .weekend-item .dt { font-family: var(--serif); font-variant: small-caps; font-weight: 500; font-size: 12px; letter-spacing: 0.14em; color: var(--red); padding-top: 4px; }
  .weekend-item .body p { margin: 0; font-family: var(--serif); font-size: 15.5px; line-height: 1.55; }
  .weekend-item .body .name { font-weight: 500; }
  .weekend-item .body .name a:hover { color: var(--red); }
  .weekend-item .body .venue { font-style: italic; color: var(--ink-2); }
  .weekend-item .body .desc { color: var(--ink-2); margin-top: 4px; }

  /* CONTROL STRIP */
  .controls { margin: 22px 0 16px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
  .controls .row { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: baseline; }
  .controls .row .lbl { font-family: var(--serif); font-style: italic; font-variant: small-caps; font-size: 12px; letter-spacing: 0.12em; color: var(--ink-3); margin-right: 10px; min-width: 64px; }
  .chip {
    background: transparent; border: none; padding: 3px 0;
    font-family: var(--serif); font-size: 14px; color: var(--ink-2);
    border-bottom: 1px solid transparent; margin-right: 14px;
    transition: color 0.15s, border-color 0.15s;
  }
  .chip:hover { color: var(--red); }
  .chip.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
  .chip.red.on { color: var(--red); border-bottom-color: var(--red); font-weight: 500; }
  .search {
    flex: 1; min-width: 180px; max-width: 260px;
    background: transparent; border: none; border-bottom: 1px solid var(--rule-2);
    padding: 4px 0; font-family: var(--serif); font-style: italic; font-size: 14px; color: var(--ink);
  }
  .search:focus { outline: none; border-bottom-color: var(--ink); }
  .search::placeholder { color: var(--ink-3); font-style: italic; }

  /* LISTINGS */
  .listings { margin-top: 4px; }
  .listing { padding: 22px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 1fr; gap: 8px; position: relative; }
  .listing.first { border-top: 1px solid var(--rule); }
  .listing.booked::before, .listing.interested::before {
    content: ""; position: absolute; left: -14px; top: 24px; width: 4px; height: calc(100% - 36px);
  }
  .listing.booked::before { background: var(--ink); }
  .listing.interested::before { background: var(--red); }
  .listing.seen { opacity: 0.5; }

  .l-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .l-cat { font-family: var(--serif); font-variant: small-caps; font-size: 11px; letter-spacing: 0.18em; color: var(--red); flex-shrink: 0; }
  .l-dates { font-family: var(--serif); font-style: italic; font-size: 12.5px; color: var(--ink-3); letter-spacing: 0.04em; }

  .l-title { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 22px; line-height: 1.2; margin: 4px 0 2px; letter-spacing: -0.005em; }
  .l-title a { text-decoration: none; }
  .l-title a:hover { color: var(--red); }

  .l-venue { font-family: var(--serif); font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }
  .l-venue .where { font-style: italic; }
  .l-venue .neighborhood { color: var(--ink-3); }
  .l-venue .price { color: var(--ink-3); font-style: italic; }
  .l-venue .price::before { content: " · "; color: var(--rule-2); }
  .l-venue .neighborhood::before { content: " · "; color: var(--rule-2); }

  .l-why { font-family: var(--serif); font-size: 15px; line-height: 1.55; color: var(--ink); margin-top: 4px; }

  .badges { display: inline-flex; gap: 10px; margin-left: 6px; flex-wrap: wrap; }
  .badge { font-family: var(--serif); font-variant: small-caps; font-style: italic; font-size: 11.5px; letter-spacing: 0.1em; padding: 1px 0; }
  .badge.weekend { color: var(--red); }
  .badge.urgent { color: var(--red); font-weight: 500; }
  .badge.soon { color: var(--ink-2); }
  .badge.future { color: var(--ink-3); }
  .badge::before { content: "— "; color: var(--rule-2); }

  .l-actions { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .act {
    background: none; border: none; padding: 0;
    font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--ink-2);
    letter-spacing: 0.03em;
    border-bottom: 1px solid var(--rule-2);
    transition: color 0.15s, border-color 0.15s;
  }
  .act:hover { color: var(--ink); border-bottom-color: var(--ink); }
  .act.on-interested { color: var(--red); border-bottom-color: var(--red); font-weight: 500; }
  .act.on-booked { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
  .act.on-seen { color: var(--ink-3); border-bottom-color: var(--ink-3); font-weight: 500; }
  .l-actions .sep { color: var(--rule-2); font-style: italic; }

  .empty { text-align: center; padding: 48px 0; font-style: italic; color: var(--ink-3); }
  .loading { text-align: center; padding: 48px 0; font-style: italic; color: var(--ink-3); }

  /* ── ON YOUR RADAR (ACT SOON) ── */
  .radar-list { border-top: 2px solid var(--ink); }
  .radar-item { padding: 14px 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 132px 1fr auto; gap: 16px; align-items: baseline; }
  .radar-item .when { font-family: var(--serif); font-variant: small-caps; font-weight: 500; font-size: 12px; letter-spacing: 0.07em; padding-top: 2px; }
  .radar-item .when.now { color: var(--red); }
  .radar-item .when.opens { color: var(--ink); }
  .radar-item .when.soft { color: var(--ink-3); }
  .radar-item .rbody .rtitle { font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.2; }
  .radar-item .rbody .rmeta { font-size: 13px; color: var(--ink-2); font-style: italic; margin-top: 2px; }
  .radar-item .rbody .rwhy { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; }
  .radar-item .rcta { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; text-align: right; }
  .radar-item .rcta a, .radar-item .rcta button { font-family: var(--serif); font-style: italic; font-size: 12.5px; color: var(--ink-2); background: none; border: none; border-bottom: 1px solid var(--rule-2); padding: 0 0 1px; white-space: nowrap; }
  .radar-item .rcta a:hover, .radar-item .rcta button:hover { color: var(--red); border-bottom-color: var(--red); }
  .radar-item .rcta button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
  .radar-empty { padding: 16px 0; font-style: italic; color: var(--ink-3); }
  .radar-sub { font-family: var(--serif); font-variant: small-caps; font-size: 12px; letter-spacing: 0.16em; color: var(--ink-3); padding: 16px 0 2px; border-bottom: 1px solid var(--rule); }
  .badge.foryou { color: var(--red); font-weight: 500; }
  .chip.foryou.on { color: var(--red); border-bottom-color: var(--red); font-weight: 500; }
  @media (max-width: 640px) {
    .radar-item { grid-template-columns: 1fr; gap: 5px; }
    .radar-item .rcta { flex-direction: row; gap: 14px; align-items: baseline; margin-top: 6px; }
  }

  /* TABS */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 26px 0 22px; border-bottom: 1px solid var(--rule); }
  .tab { background: none; border: none; padding: 6px 0 10px; font-family: var(--serif); font-variant: small-caps; font-size: 15px; letter-spacing: 0.1em; color: var(--ink-3); border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--red); }
  .tab.on { color: var(--ink); border-bottom-color: var(--red); font-weight: 500; }
  .tab .tcount { font-size: 10.5px; font-variant: normal; letter-spacing: 0; color: var(--ink-3); margin-left: 3px; }
  #view section + section { margin-top: 40px; }
  .act.remove { color: var(--ink-3); border-bottom-color: var(--rule); margin-left: auto; }
  .act.remove:hover { color: var(--red); border-bottom-color: var(--red); }
  .radar-item .rcta button.rremove { color: var(--ink-3); border-bottom: none; }
  .radar-item .rcta button.rremove:hover { color: var(--red); }
  .removed-item { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--rule); font-family: var(--serif); font-size: 15px; color: var(--ink-2); }
  .removed-item em { color: var(--ink-3); font-size: 12px; }

  /* COLOPHON */
  .colophon { margin-top: 56px; padding-top: 24px; border-top: 2px solid var(--ink); text-align: center; font-family: var(--serif); font-style: italic; font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }
  .colophon .ornament { display: block; margin: 0 auto 12px; font-size: 14px; color: var(--rule-2); letter-spacing: 0.6em; }
  .colophon .signout { background: none; border: none; font: inherit; color: var(--ink-3); text-decoration: underline; text-decoration-style: dotted; cursor: pointer; padding: 0; margin-top: 8px; }
  .colophon .signout:hover { color: var(--red); }

  @media (max-width: 640px) {
    .page { padding: 32px 22px 60px; }
    .title { font-size: 36px; }
    .weekend-item { grid-template-columns: 1fr; gap: 4px; }
    .weekend-item .dt { padding-top: 0; }
    .listing.booked::before, .listing.interested::before { left: -8px; }
    .controls .row .lbl { min-width: 0; }
  }
</style>

     Sensitive cross-app data stays protected by RLS; this app only

<!-- MAIN APP -->
<div class="app show" id="app">
  <div class="page">

    <header class="masthead">
      <p class="kicker">A Weekly Guide to NYC</p>
      <h1 class="title">Goings On About Town</h1>

    </header>

      Compiled from <em>The New Yorker</em>, the <em>Times</em>, <em>Time Out</em>, and venue calendars.<br>
      Refreshed Sunday mornings &nbsp;·&nbsp; Synced across your devices.<br>
    </footer>

  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://kdaxubsmszojkdsxjpgs.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Z31hI91ksy8uDB1x-sVP_A_aSuVVaF0';
  const SOON_DAYS = 14;

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
  });

  // Public app — no auth. All queries use Juli's hardcoded user_id.
  // Anon role has scoped RLS policy for weekend_status (migration 005).
  const JULI_USER_ID = 'b87e0ad9-cb4c-4452-b523-c28249fece62';

  // ── DATE HELPERS ────────────────────────────────────────────
  const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

  function computeWeekend() {
    const dow = TODAY.getDay(); // 0=Sun..6=Sat
    const start = new Date(TODAY);
    let offset;
    if (dow === 5)      offset = 0;      // Fri: today
    else if (dow === 6) offset = 0;      // Sat: today (already in weekend)
    else if (dow === 0) offset = 5;      // Sun: preview next Fri
    else                offset = 5 - dow;// Mon-Thu: upcoming Fri
    start.setDate(start.getDate() + offset);
    const end = new Date(start);
    end.setDate(end.getDate() + (dow === 6 ? 1 : 2));
    end.setHours(23,59,59,999);
    return { start, end };
  }
  const { start: WEEKEND_START, end: WEEKEND_END } = computeWeekend();

  function daysUntil(dateStr) {
    return Math.ceil((new Date(dateStr) - TODAY) / 86400000);
  }
  const pd = s => new Date(s + 'T12:00:00'); // parse YYYY-MM-DD as a local day (avoids UTC off-by-one)
  function fmtShort(dateStr) {
    return pd(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function fmtRange(start, end) {
    if (start === end) return fmtShort(start);
    const sD = pd(start), eD = pd(end);
    if (sD.getMonth() === eD.getMonth() && sD.getFullYear() === eD.getFullYear()) {
      return sD.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + '–' + eD.getDate();
    }
    return fmtShort(start) + ' – ' + fmtShort(end);
  }
  function fmtEditorialRun(start, end) {
    const sD = pd(start), eD = pd(end);
    if (start === end) return 'On ' + sD.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
    if (eD < TODAY)  return 'Closed';
    if (sD <= TODAY) return 'Through ' + eD.toLocaleDateString('en-US', { month:'long', day:'numeric' });
    return 'Opens ' + sD.toLocaleDateString('en-US', { month:'long', day:'numeric' }) + ', through ' + eD.toLocaleDateString('en-US', { month:'long', day:'numeric' });
  }
  function closingBadge(end) {
    const d = daysUntil(end);
    if (d < 0) return null;
    if (d === 0) return { text: 'Closes today', cls: 'urgent' };
    if (d <= 7)  return { text: 'Closes in ' + d + ' day' + (d===1?'':'s'), cls: 'urgent' };
    if (d <= 14) return { text: 'Closing soon', cls: 'soon' };
    return null;
  }
  function futureBadge(start) {
    const d = daysUntil(start);
    if (d > 14) return { text: 'Opens ' + fmtShort(start), cls: 'future' };
    return null;
  }
  function isThisWeekend(ev) {
    const s = new Date(ev.start), e = new Date(ev.end);
    return s <= WEEKEND_END && e >= WEEKEND_START;
  }
  function gcalUrl(ev) {
    const fmt = d => d.replace(/-/g, '');
    const start = fmt(ev.start);
    const isOneNight = ev.start === ev.end;
    let dates;
    if (isOneNight) {
      dates = start + 'T200000/' + start + 'T230000';
    } else {
      const eD = new Date(ev.end);
      eD.setUTCDate(eD.getUTCDate() + 1);
      dates = start + '/' + eD.toISOString().slice(0,10).replace(/-/g,'');
    }
    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: ev.title,
      dates: dates,
      details: ev.why + '\n\nTickets: ' + ev.url,
      location: ev.venue + ', ' + ev.hood + ', NYC'
    });
    return 'https://calendar.google.com/calendar/render?' + params.toString();
  }

  // ── STATE ────────────────────────────────────────────────────
  let events = [];
  let statusMap = {};
  const filters = { cat: 'all', status: 'all', soon: false, foryou: false, search: '' };

  // ── TASTE PROFILE (mirrors assistant_preferences.data.culture.taste) ──
  const TASTE = {
    cat: { 'Art Galleries':5, 'Museum Exhibits':5, Art:5, Film:5, Theatre:4, Classical:4, Concert:3, Opera:2, Ballet:2 },
    venues: ['film forum','ifc','metrograph','angelika','quad','roxy','bam','nitehawk','maysles','noguchi','moma','guggenheim','japan society','brooklyn museum','judd','marianne boesky','alexander gray','salon 94','perrotin','levy gorvy','berry campbell','nino mier','gagosian','vineyard','atlantic','koch','carnegie','met opera','brooklyn paramount','armory','greenwich house'],
    cues: ['noguchi','ozu','hamaguchi','japan','japanese','sakamoto','mishima','kogonada','duchamp','modernism','modernist','kahlo','rivera','frankenthaler','semmel','mckinney','brancusi','krasner','pollock','balanchine','van herpen','bunuel','spanish','latin','korean','james blake','lafourcade','dudamel','premiere','retrospective','auteur'],
    avoid: ['jukebox','arena','tourist','broadway musical','immersive experience']
  };
  const FORYOU_MIN = 9;
  function tasteScore(ev) {
    let s = TASTE.cat[ev.cat] || 2;
    const hay = ((ev.title||'') + ' ' + (ev.venue||'') + ' ' + (ev.why||'')).toLowerCase();
    if (TASTE.venues.some(v => hay.includes(v))) s += 4;
    TASTE.cues.forEach(c => { if (hay.includes(c)) s += 2; });
    if (TASTE.avoid.some(a => hay.includes(a))) s -= 6;
    return s;
  }

  // ── BOOKING RADAR: what needs action, and when ──
  function radarAction(ev) {
    const st = statusMap[ev.id] || 'none';
    if (st === 'booked' || st === 'seen') return null;
    const fd = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    if (ev.bookingOpens && new Date(ev.bookingOpens + 'T12:00:00') >= TODAY) {
      return { date: new Date(ev.bookingOpens + 'T12:00:00'), label: (ev.membership ? ev.membership + ' presale ' : 'Presale ') + fd(ev.bookingOpens), cls: 'opens' };
    }
    if (ev.bookingDeadline && daysUntil(ev.bookingDeadline) >= 0) {
      return { date: new Date(ev.bookingDeadline + 'T12:00:00'), label: 'Book by ' + fd(ev.bookingDeadline), cls: 'now' };
    }
    if (ev.advance && new Date(ev.end) >= TODAY) {
      return { date: new Date(ev.start), label: 'On sale — books out', cls: 'now' };
    }
    const d = daysUntil(ev.end);
    if (d >= 0 && d <= SOON_DAYS) {
      return { date: new Date(ev.end), label: d === 0 ? 'Closes today' : 'Closes in ' + d + 'd', cls: 'soft' };
    }
    return null;
  }

  // ── DATA ─────────────────────────────────────────────────────
  async function loadEvents() {
    const { data, error } = await supabase
      .from('weekend_events')
      .select('*')
      .eq('archived', false)
      .order('end_date', { ascending: true });
    if (error) { console.error(error); return; }
    events = data.map(r => ({
      id: r.id, title: r.title, cat: r.category, venue: r.venue, hood: r.neighborhood,
      start: r.start_date, end: r.end_date, price: r.price, url: r.url, why: r.why,
      advance: r.advance_required, bookingOpens: r.booking_opens, bookingDeadline: r.booking_deadline, membership: r.membership
    }));
  }

  async function loadStatus() {
    const { data, error } = await supabase
      .from('weekend_status')
      .select('event_id, status')
      .eq('user_id', JULI_USER_ID);
    if (error) { console.error(error); return; }
    statusMap = {};
    data.forEach(r => { statusMap[r.event_id] = r.status; });
  }

  async function toggleStatus(eventId, newStatus) {
    const current = statusMap[eventId];
    if (current === newStatus) {
      // Clear
      delete statusMap[eventId];
      render();
      const { error } = await supabase
        .from('weekend_status').delete()
        .eq('user_id', JULI_USER_ID).eq('event_id', eventId);
      if (error) { console.error(error); await loadStatus(); render(); }
    } else {
      statusMap[eventId] = newStatus;
      render();
      const { error } = await supabase
        .from('weekend_status')
        .upsert({ user_id: JULI_USER_ID, event_id: eventId, status: newStatus });
      if (error) { console.error(error); await loadStatus(); render(); }
    }
  }

  // ── VIEW HELPERS ────────────────────────────────────────────
  let activeTab = 'Radar';
  const live = () => events.filter(ev => statusMap[ev.id] !== 'dismissed');
  const CAT_ORDER = ['Art Galleries','Museum Exhibits','Film','Theatre','Classical','Concert','Opera','Ballet','Dance'];
  function categoriesInData() {
    const present = [...new Set(live().map(ev => ev.cat).filter(Boolean))];
    return present.sort((a, b) => (((CAT_ORDER.indexOf(a) + 1) || 99) - ((CAT_ORDER.indexOf(b) + 1) || 99)));
  }
  function banner(label, count) {
    return '<div class="banner"><span class="label">' + label + '</span>' +
           '<span class="rule"></span><span class="count">' + (count || '') + '</span></div>';
  }

  // ── LISTING CARD ────────────────────────────────────────────
  function buildListing(ev, idx) {
    const status = statusMap[ev.id] || 'none';
    const div = document.createElement('div');
    div.className = 'listing' + (idx === 0 ? ' first' : '') + (status !== 'none' ? ' ' + status : '');
    const cb = closingBadge(ev.end);
    const fb = futureBadge(ev.start);
    const wk = isThisWeekend(ev) ? '<span class="badge weekend">This weekend</span>' : '';
    const closeB = cb ? '<span class="badge ' + cb.cls + '">' + cb.text + '</span>' : '';
    const futB = fb ? '<span class="badge future">' + fb.text + '</span>' : '';
    const fy = tasteScore(ev) >= FORYOU_MIN ? '<span class="badge foryou">For you</span>' : '';
    div.innerHTML =
      '<div class="l-head">' +
        '<span class="l-cat">' + ev.cat + '</span>' +
        '<span class="l-dates"><em>' + fmtEditorialRun(ev.start, ev.end) + '</em>' +
          '<span class="badges">' + fy + wk + closeB + futB + '</span>' +
        '</span>' +
      '</div>' +
      '<h3 class="l-title"><a href="' + ev.url + '" target="_blank" rel="noopener">' + ev.title + '</a></h3>' +
      '<div class="l-venue"><span class="where">' + ev.venue + '</span>' +
        '<span class="neighborhood">' + ev.hood + '</span>' +
        '<span class="price">' + (ev.price || '') + '</span>' +
      '</div>' +
      '<p class="l-why">' + (ev.why || '') + '</p>' +
      '<div class="l-actions">' +
        '<button class="act ' + (status==='interested'?'on-interested':'') + '" data-st="interested">' + (status==='interested'?'★ Interested':'☆ Interested') + '</button>' +
        '<button class="act ' + (status==='booked'?'on-booked':'') + '" data-st="booked">' + (status==='booked'?'✓ Booked':'Mark booked') + '</button>' +
        '<button class="act ' + (status==='seen'?'on-seen':'') + '" data-st="seen">' + (status==='seen'?'● Seen':'Mark seen') + '</button>' +
        '<a class="act" href="' + ev.url + '" target="_blank" rel="noopener">Tickets ↗</a>' +
        '<a class="act" href="' + gcalUrl(ev) + '" target="_blank" rel="noopener">Add to calendar</a>' +
        '<button class="act remove" data-st="dismissed" title="Remove from app">✕ Remove</button>' +
      '</div>';
    div.querySelectorAll('button.act[data-st]').forEach(btn => btn.addEventListener('click', () => toggleStatus(ev.id, btn.dataset.st)));
    return div;
  }

  // ── RADAR VIEW (Act Soon + This Weekend) ────────────────────
  function buildRadarView() {
    const wrap = document.createElement('div');
    const scored = live().map(ev => ({ ev, act: radarAction(ev) })).filter(x => x.act);
    const book = scored.filter(x => x.act.cls !== 'soft').sort((a, b) => a.act.date - b.act.date);
    const closing = scored.filter(x => x.act.cls === 'soft').sort((a, b) => a.act.date - b.act.date).slice(0, 6);
    const total = book.length + closing.length;
    const sec = document.createElement('section');
    sec.className = 'radar';
    sec.innerHTML = banner('On Your Radar — Act Soon', total ? total + ' to act on' : '');
    const listEl = document.createElement('div');
    listEl.className = 'radar-list';
    if (!total) {
      listEl.innerHTML = '<div class="radar-empty">Nothing needs booking right now — you’re clear.</div>';
    } else {
      const item = ({ ev, act }) => {
        const st = statusMap[ev.id] || 'none';
        const div = document.createElement('div');
        div.className = 'radar-item';
        div.innerHTML =
          '<div class="when ' + act.cls + '">' + act.label + '</div>' +
          '<div class="rbody">' +
            '<div class="rtitle"><a href="' + ev.url + '" target="_blank" rel="noopener">' + ev.title + '</a></div>' +
            '<div class="rmeta">' + ev.cat + ' · ' + ev.venue + (ev.price ? ' · ' + ev.price : '') + '</div>' +
            '<div class="rwhy">' + (ev.why || '') + '</div>' +
          '</div>' +
          '<div class="rcta">' +
            '<a href="' + ev.url + '" target="_blank" rel="noopener">Tickets ↗</a>' +
            '<button class="' + (st === 'interested' ? 'on' : '') + '" data-st="interested">' + (st === 'interested' ? '★ Interested' : '☆ Interested') + '</button>' +
            '<button class="' + (st === 'booked' ? 'on' : '') + '" data-st="booked">' + (st === 'booked' ? '✓ Booked' : 'Mark booked') + '</button>' +
            '<button class="rremove" data-st="dismissed" title="Remove from app">✕</button>' +
          '</div>';
        div.querySelectorAll('button[data-st]').forEach(btn => btn.addEventListener('click', () => toggleStatus(ev.id, btn.dataset.st)));
        return div;
      };
      const group = (label, arr) => {
        if (!arr.length) return;
        const h = document.createElement('div');
        h.className = 'radar-sub';
        h.textContent = label;
        listEl.appendChild(h);
        arr.forEach(x => listEl.appendChild(item(x)));
      };
      group('Book ahead — sells out / presale', book);
      group('Closing this week', closing);
    }
    sec.appendChild(listEl);
    wrap.appendChild(sec);

    const weekendEvents = live().filter(isThisWeekend).sort((a, b) => new Date(a.start) - new Date(b.start));
    const wsec = document.createElement('section');
    wsec.innerHTML = banner('This Weekend', weekendEvents.length + ' listing' + (weekendEvents.length === 1 ? '' : 's')) +
      '<p class="weekend-intro">A selection of what’s worth your Friday through Sunday.</p>';
    const wl = document.createElement('div');
    wl.className = 'weekend-list';
    if (!weekendEvents.length) wl.innerHTML = '<div class="empty">Nothing matched for this weekend.</div>';
    weekendEvents.forEach(ev => {
      const div = document.createElement('div');
      div.className = 'weekend-item';
      div.innerHTML =
        '<div class="dt">' + ev.cat + '<br>' + fmtRange(ev.start, ev.end) + '</div>' +
        '<div class="body">' +
          '<p class="name"><a href="' + ev.url + '" target="_blank" rel="noopener">' + ev.title + '</a></p>' +
          '<p><span class="venue">' + ev.venue + ', ' + ev.hood + '.</span></p>' +
          '<p class="desc">' + (ev.why || '') + '</p>' +
        '</div>';
      wl.appendChild(div);
    });
    wsec.appendChild(wl);
    wrap.appendChild(wsec);
    return wrap;
  }

  // ── CATEGORY VIEW ───────────────────────────────────────────
  function buildCategoryView(cat) {
    const wrap = document.createElement('div');
    const sec = document.createElement('section');
    const statuses = [['all','All'],['interested','Interested'],['booked','Booked'],['seen','Seen'],['none','Unmarked']];
    sec.innerHTML =
      banner(cat, '') +
      '<div class="controls"><div class="row">' +
        '<span class="lbl">Status</span>' +
        statuses.map(([v,l]) => '<button class="chip' + (filters.status===v?' on':'') + '" data-status="' + v + '">' + l + '</button>').join('') +
        '<button class="chip foryou' + (filters.foryou?' on':'') + '" data-f="foryou" style="margin-left:auto">★ For you</button>' +
        '<button class="chip red' + (filters.soon?' on':'') + '" data-f="soon">Closing soon</button>' +
      '</div><div class="row"><span class="lbl">Search</span>' +
        '<input class="search" id="cat-search" type="search" placeholder="title, venue, neighborhood…"></div></div>';
    const list = document.createElement('div');
    list.className = 'listings';
    const cnt = sec.querySelector('.count');
    function paint() {
      const filtered = live().filter(ev => {
        if (ev.cat !== cat) return false;
        const s = statusMap[ev.id] || 'none';
        if (filters.status !== 'all') {
          if (filters.status === 'none' && s !== 'none') return false;
          if (filters.status !== 'none' && s !== filters.status) return false;
        }
        if (filters.soon) { const d = daysUntil(ev.end); if (d < 0 || d > SOON_DAYS) return false; }
        if (filters.foryou && tasteScore(ev) < FORYOU_MIN) return false;
        if (filters.search) {
          const q = filters.search.toLowerCase();
          const hay = (ev.title + ' ' + ev.venue + ' ' + ev.hood + ' ' + ev.cat + ' ' + ev.why).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).sort((a, b) => filters.foryou ? (tasteScore(b) - tasteScore(a)) : (new Date(a.end) - new Date(b.end)));
      cnt.textContent = filtered.length + ' listing' + (filtered.length === 1 ? '' : 's');
      list.innerHTML = '';
      if (!filtered.length) { list.innerHTML = '<div class="empty">No listings match these filters.</div>'; return; }
      filtered.forEach((ev, i) => list.appendChild(buildListing(ev, i)));
    }
    sec.appendChild(list);
    sec.querySelectorAll('.chip[data-status]').forEach(b => b.addEventListener('click', () => {
      sec.querySelectorAll('.chip[data-status]').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); filters.status = b.dataset.status; paint();
    }));
    sec.querySelector('[data-f="foryou"]').addEventListener('click', e => { filters.foryou = !filters.foryou; e.currentTarget.classList.toggle('on', filters.foryou); paint(); });
    sec.querySelector('[data-f="soon"]').addEventListener('click', e => { filters.soon = !filters.soon; e.currentTarget.classList.toggle('on', filters.soon); paint(); });
    const si = sec.querySelector('#cat-search');
    si.value = filters.search;
    si.addEventListener('input', e => { filters.search = e.target.value; paint(); });
    paint();
    wrap.appendChild(sec);
    return wrap;
  }

  // ── REMOVED VIEW ────────────────────────────────────────────
  function buildRemovedView() {
    const wrap = document.createElement('div');
    const sec = document.createElement('section');
    const removed = events.filter(ev => statusMap[ev.id] === 'dismissed');
    sec.innerHTML = banner('Removed', removed.length + ' hidden');
    const list = document.createElement('div');
    if (!removed.length) list.innerHTML = '<div class="empty">Nothing removed.</div>';
    removed.forEach(ev => {
      const div = document.createElement('div');
      div.className = 'removed-item';
      div.innerHTML = '<span>' + ev.title + ' <em>· ' + ev.cat + '</em></span>';
      const b = document.createElement('button');
      b.className = 'act'; b.textContent = 'Restore';
      b.addEventListener('click', () => toggleStatus(ev.id, 'dismissed'));
      div.appendChild(b);
      list.appendChild(div);
    });
    sec.appendChild(list);
    wrap.appendChild(sec);
    return wrap;
  }

  // ── BOOKED VIEW (on the books, by category) ─────────────────
  function buildBookedView() {
    const wrap = document.createElement('div');
    const booked = live().filter(ev => statusMap[ev.id] === 'booked');
    const sec = document.createElement('section');
    sec.innerHTML = banner('On the Books', booked.length ? booked.length + ' booked' : '');
    if (!booked.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = 'Nothing booked yet. Mark an event <em>Booked</em> and it collects here by category, in date order.';
      sec.appendChild(e); wrap.appendChild(sec); return wrap;
    }
    const cats = [...new Set(booked.map(ev => ev.cat))]
      .sort((a, b) => (((CAT_ORDER.indexOf(a) + 1) || 99) - ((CAT_ORDER.indexOf(b) + 1) || 99)));
    cats.forEach(cat => {
      const inCat = booked.filter(ev => ev.cat === cat).sort((a, b) => new Date(a.start) - new Date(b.start));
      const h = document.createElement('div');
      h.className = 'radar-sub';
      h.textContent = cat + ' · ' + inCat.length;
      sec.appendChild(h);
      const list = document.createElement('div');
      list.className = 'weekend-list';
      inCat.forEach(ev => {
        const div = document.createElement('div');
        div.className = 'weekend-item';
        div.innerHTML =
          '<div class="dt">' + fmtRange(ev.start, ev.end) + '</div>' +
          '<div class="body">' +
            '<p class="name"><a href="' + ev.url + '" target="_blank" rel="noopener">' + ev.title + '</a></p>' +
            '<p><span class="venue">' + ev.venue + (ev.hood ? ', ' + ev.hood : '') + '.</span></p>' +
            '<div class="l-actions" style="margin-top:6px">' +
              '<a class="act" href="' + gcalUrl(ev) + '" target="_blank" rel="noopener">Add to calendar</a>' +
              '<button class="act" data-st="seen">Mark seen</button>' +
              '<button class="act" data-st="booked">Unbook</button>' +
            '</div>' +
          '</div>';
        div.querySelectorAll('button[data-st]').forEach(b => b.addEventListener('click', () => toggleStatus(ev.id, b.dataset.st)));
        list.appendChild(div);
      });
      sec.appendChild(list);
    });
    wrap.appendChild(sec);
    return wrap;
  }

  // ── TABS + DISPATCH ─────────────────────────────────────────
  function renderTabs() {
    const removedCount = events.filter(ev => statusMap[ev.id] === 'dismissed').length;
    const tabs = ['Radar', 'Booked', ...categoriesInData()];
    if (removedCount) tabs.push('Removed');
    if (!tabs.includes(activeTab)) activeTab = 'Radar';
    const nav = document.getElementById('tabs');
    nav.innerHTML = '';
    tabs.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tab' + (t === activeTab ? ' on' : '');
      let n = '';
      if (t === 'Radar') n = live().filter(ev => radarAction(ev)).length;
      else if (t === 'Booked') n = live().filter(ev => statusMap[ev.id] === 'booked').length;
      else if (t === 'Removed') n = removedCount;
      else n = live().filter(ev => ev.cat === t).length;
      b.innerHTML = t + (n ? ' <span class="tcount">' + n + '</span>' : '');
      b.addEventListener('click', () => { activeTab = t; render(); window.scrollTo(0, 0); });
      nav.appendChild(b);
    });
  }

  function renderView() {
    const view = document.getElementById('view');
    view.innerHTML = '';
    let node;
    if (activeTab === 'Radar') node = buildRadarView();
    else if (activeTab === 'Booked') node = buildBookedView();
    else if (activeTab === 'Removed') node = buildRemovedView();
    else node = buildCategoryView(activeTab);
    view.appendChild(node);
  }

  // ── RENDER ──────────────────────────────────────────────────
  function render() {
    document.getElementById('dateline-date').textContent =
      TODAY.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    const L = live();
    const actNow = L.filter(ev => radarAction(ev)).length;
    const interestedCount = L.filter(ev => statusMap[ev.id] === 'interested').length;
    const bookedCount = L.filter(ev => statusMap[ev.id] === 'booked').length;
    document.getElementById('intro-line').innerHTML =
      '<em>' + actNow + '</em> to act on <span class="dot">·</span> ' +
      '<em>' + L.length + '</em> events tracked <span class="dot">·</span> ' +
      '<em>' + interestedCount + '</em> shortlisted <span class="dot">·</span> ' +
      '<em>' + bookedCount + '</em> booked.';
    renderTabs();
    renderView();
  }

  // ── BOOT (no auth — public app, queries hardcoded to JULI_USER_ID) ──
  await Promise.all([loadEvents(), loadStatus()]);
  render();

  // ── SERVICE WORKER ──────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
